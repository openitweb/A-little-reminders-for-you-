<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Little Reminder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#08052b}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:hidden}
.page.active{display:block}
.page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;display:block;background:transparent;border:none;padding:0;margin:0;cursor:pointer;z-index:20;outline:none}
#startHere{left:15%;top:73.5%;width:70%;height:8%}
#openButton{left:20%;top:73%;width:60%;height:9%}
#sadButton{left:16%;top:36.5%;width:68%;height:6%}
#madButton{left:16%;top:44%;width:68%;height:6%}
#missButton{left:16%;top:51%;width:68%;height:6%}
#jealousButton{left:16%;top:58%;width:68%;height:6%}
#backFromSad{left:7%;top:77%;width:54%;height:7%}
#backFromMad{left:5%;top:76%;width:55%;height:8%}
#backFromMiss{left:6%;top:75%;width:48%;height:8%}
#lastOne{left:6%;top:75%;width:60%;height:8%}
#backToStart{left:26%;top:89%;width:48%;height:7%}
</style>
</head>
<body>
<div id="app">
<div class="page active" id="page1"><img src="page1.jpg" alt="Page 1"><button class="hotspot" id="startHere" aria-label="START HERE"></button></div>
<div class="page" id="page2"><img src="page2.jpg" alt="Page 2"><button class="hotspot" id="openButton" aria-label="OPEN"></button></div>
<div class="page" id="page3"><img src="page3.jpg" alt="Page 3"><button class="hotspot" id="sadButton" aria-label="YOU'RE SAD"></button><button class="hotspot" id="madButton" aria-label="YOU'RE MAD"></button><button class="hotspot" id="missButton" aria-label="YOU MISS ME"></button><button class="hotspot" id="jealousButton" aria-label="YOU'RE JEALOUS"></button></div>
<div class="page" id="page4"><img src="page4.jpg" alt="Sad reminder"><button class="hotspot" id="backFromSad" aria-label="GO BACK"></button></div>
<div class="page" id="page5"><img src="page5.jpg" alt="Mad reminder"><button class="hotspot" id="backFromMad" aria-label="GO BACK"></button></div>
<div class="page" id="page6"><img src="page6.jpg" alt="Miss you reminder"><button class="hotspot" id="backFromMiss" aria-label="GO BACK"></button></div>
<div class="page" id="page7"><img src="page7.jpg" alt="Jealous reminder"><button class="hotspot" id="lastOne" aria-label="AND THE LAST ONE"></button></div>
<div class="page" id="page8"><img src="page8.jpg" alt="Final reminder"><button class="hotspot" id="backToStart" aria-label="BACK TO START"></button></div>
</div>
<audio id="music" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
<script>
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page'+n).classList.add('active');window.scrollTo(0,0)}
const music=document.getElementById('music');music.volume=0.50;
function startMusic(){music.volume=0.50;music.play().catch(()=>{})}
window.addEventListener('load',()=>{music.play().catch(()=>{})});
document.getElementById('startHere').onclick=()=>{startMusic();showPage(2)};
document.getElementById('openButton').onclick=()=>{startMusic();showPage(3)};
document.getElementById('sadButton').onclick=()=>{startMusic();showPage(4)};
document.getElementById('madButton').onclick=()=>{startMusic();showPage(5)};
document.getElementById('missButton').onclick=()=>{startMusic();showPage(6)};
document.getElementById('jealousButton').onclick=()=>{startMusic();showPage(7)};
document.getElementById('backFromSad').onclick=()=>showPage(3);
document.getElementById('backFromMad').onclick=()=>showPage(3);
document.getElementById('backFromMiss').onclick=()=>showPage(3);
document.getElementById('lastOne').onclick=()=>{startMusic();showPage(8)};
document.getElementById('backToStart').onclick=()=>showPage(1);
</script>
</body>
</html>
