<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>A Little Reminder</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: manipulation;
}

#book {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

.page {
    position: absolute;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;
    align-items: center;
    justify-content: center;

    background: black;
}

.page.active {
    display: flex;
}

.page img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#music {
    display: none;
}
</style>
</head>

<body>

<div id="book">

    <div class="page active">
        <img src="page1.png" alt="">
    </div>

    <div class="page">
        <img src="page2.png" alt="">
    </div>

    <div class="page">
        <img src="page3.png" alt="">
    </div>

    <div class="page">
        <img src="page4.png" alt="">
    </div>

    <div class="page">
        <img src="page5.png" alt="">
    </div>

    <div class="page">
        <img src="page6.png" alt="">
    </div>

    <div class="page">
        <img src="page7.png" alt="">
    </div>

    <div class="page">
        <img src="page8.png" alt="">
    </div>

</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const pages = document.querySelectorAll(".page");
const music = document.getElementById("music");

let currentPage = 0;
let started = false;

function startMusic() {

    if (!started) {

        started = true;

        music.volume = 1.0;

        music.play().catch(function(error) {
            console.log("Music blocked:", error);
        });
    }
}

function nextPage() {

    // First tap starts the music
    startMusic();

    // Already on last page
    if (currentPage >= pages.length - 1) {
        return;
    }

    // Hide current page
    pages[currentPage].classList.remove("active");

    // Next page
    currentPage++;

    pages[currentPage].classList.add("active");
}


// TAP / CLICK
document.addEventListener("click", function() {
    nextPage();
});


// PHONE TOUCH
document.addEventListener("touchend", function(event) {

    event.preventDefault();

    nextPage();

}, { passive: false });

</script>

</body>
</html>
