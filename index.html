<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>A Little Reminder for You</title>


<style>

/* =====================================
   RESET
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;
}


/* =====================================
   PAGE
===================================== */

.page {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    overflow: hidden;

    background: #ffffff;
}

.page.active {
    display: block;
}


/* =====================================
   IMAGE

   COVER = walang pink sa left/right
===================================== */

.page-image {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 100vw;
    height: 100vh;

    transform: translate(-50%, -50%);

    object-fit: cover;

    object-position: center center;

    display: block;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =====================================
   CLICKABLE AREA
===================================== */

.click {

    position: absolute;

    display: block;

    z-index: 100;

    background: transparent;

    border: none;

    outline: none;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    user-select: none;
}


/* =====================================
   PAGE 1

   OPEN THIS
   6% higher
===================================== */

.page1-button {

    width: 160px;
    height: 58px;

    left: 50%;

    top: 77%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 2

   BUTTON
   6% higher
===================================== */

.page2-button {

    width: 160px;
    height: 58px;

    left: 50%;

    top: 77%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 3

   EMOTION BUTTONS
===================================== */


/* YOU'RE SAD */

.page3-sad {

    width: 150px;
    height: 52px;

    left: 50%;
    top: 34%;

    transform: translateX(-50%);
}


/* YOU'RE MAD */

.page3-mad {

    width: 150px;
    height: 52px;

    left: 50%;
    top: 45%;

    transform: translateX(-50%);
}


/* YOU MISS ME */

.page3-miss {

    width: 150px;
    height: 52px;

    left: 50%;
    top: 56%;

    transform: translateX(-50%);
}


/* YOU'RE JEALOUS
   7% higher
*/

.page3-jealous {

    width: 150px;
    height: 52px;

    left: 50%;
    top: 62%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 4

   GO BACK
   slightly higher
===================================== */

.page4-button {

    width: 135px;
    height: 52px;

    left: 50%;
    top: 83%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 5

   GO BACK
   3% higher
===================================== */

.page5-button {

    width: 135px;
    height: 52px;

    left: 50%;
    top: 80%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 6

   GO BACK
   8% higher
===================================== */

.page6-button {

    width: 135px;
    height: 52px;

    left: 50%;
    top: 75%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 7

   AND THE LAST ONE
   slightly higher
===================================== */

.page7-button {

    width: 160px;
    height: 52px;

    left: 50%;
    top: 82%;

    transform: translateX(-50%);
}


/* =====================================
   PAGE 8

   BACK TO START
   slightly higher
===================================== */

.page8-button {

    width: 155px;
    height: 52px;

    left: 50%;
    top: 82%;

    transform: translateX(-50%);
}


/* =====================================
   MUSIC BUTTON
===================================== */

.music-button {

    position: fixed;

    top: 10px;
    right: 10px;

    width: 40px;
    height: 40px;

    z-index: 1000;

    border: 2px solid #ffffff;

    background: #e978a7;

    color: #ffffff;

    font-size: 16px;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 600px) {

    .page-image {

        width: 100vw;
        height: 100vh;

        object-fit: cover;

    }


    .page1-button,
    .page2-button {

        width: 150px;
        height: 55px;

    }


    .page3-sad,
    .page3-mad,
    .page3-miss,
    .page3-jealous {

        width: 145px;
        height: 52px;

    }


    .page4-button,
    .page5-button,
    .page6-button {

        width: 130px;
        height: 50px;

    }


    .page7-button,
    .page8-button {

        width: 150px;
        height: 50px;

    }


    .music-button {

        width: 38px;
        height: 38px;

        top: 8px;
        right: 8px;

    }

}

</style>

</head>



<body>


<!-- =====================================
     MUSIC
===================================== -->

<audio
    id="music"
    src="music.mp3"
    loop>
</audio>



<!-- =====================================
     MUSIC CONTROL
===================================== -->

<button
    id="musicButton"
    class="music-button"
    type="button"
    onclick="toggleMusic()">

    ♫

</button>



<!-- =====================================
     PAGE 1
===================================== -->

<section
    class="page active"
    id="page1">

    <img
        src="page1.jpg"
        class="page-image"
        alt="Page 1">

    <a
        href="#page2"
        class="click page1-button"
        onclick="goToPage(2); return false;"
        aria-label="Open">

    </a>

</section>



<!-- =====================================
     PAGE 2
===================================== -->

<section
    class="page"
    id="page2">

    <img
        src="page2.jpg"
        class="page-image"
        alt="Page 2">

    <a
        href="#page3"
        class="click page2-button"
        onclick="goToPage(3); return false;"
        aria-label="Open">

    </a>

</section>



<!-- =====================================
     PAGE 3
===================================== -->

<section
    class="page"
    id="page3">

    <img
        src="page3.jpg"
        class="page-image"
        alt="Choose an emotion">


    <!-- YOU'RE SAD -->

    <a
        href="#page4"
        class="click page3-sad"
        onclick="goToPage(4); return false;"
        aria-label="You're Sad">

    </a>


    <!-- YOU'RE MAD -->

    <a
        href="#page5"
        class="click page3-mad"
        onclick="goToPage(5); return false;"
        aria-label="You're Mad">

    </a>


    <!-- YOU MISS ME -->

    <a
        href="#page6"
        class="click page3-miss"
        onclick="goToPage(6); return false;"
        aria-label="You Miss Me">

    </a>


    <!-- YOU'RE JEALOUS -->

    <a
        href="#page7"
        class="click page3-jealous"
        onclick="goToPage(7); return false;"
        aria-label="You're Jealous">

    </a>

</section>



<!-- =====================================
     PAGE 4
===================================== -->

<section
    class="page"
    id="page4">

    <img
        src="page4.jpg"
        class="page-image"
        alt="You're Sad">

    <a
        href="#page3"
        class="click page4-button"
        onclick="goToPage(3); return false;"
        aria-label="Go Back">

    </a>

</section>



<!-- =====================================
     PAGE 5
===================================== -->

<section
    class="page"
    id="page5">

    <img
        src="page5.jpg"
        class="page-image"
        alt="You're Mad">

    <a
        href="#page3"
        class="click page5-button"
        onclick="goToPage(3); return false;"
        aria-label="Go Back">

    </a>

</section>



<!-- =====================================
     PAGE 6
===================================== -->

<section
    class="page"
    id="page6">

    <img
        src="page6.jpg"
        class="page-image"
        alt="You Miss Me">

    <a
        href="#page3"
        class="click page6-button"
        onclick="goToPage(3); return false;"
        aria-label="Go Back">

    </a>

</section>



<!-- =====================================
     PAGE 7
===================================== -->

<section
    class="page"
    id="page7">

    <img
        src="page7.jpg"
        class="page-image"
        alt="You're Jealous">

    <a
        href="#page8"
        class="click page7-button"
        onclick="goToPage(8); return false;"
        aria-label="And the Last One">

    </a>

</section>



<!-- =====================================
     PAGE 8
===================================== -->

<section
    class="page"
    id="page8">

    <img
        src="page8.jpg"
        class="page-image"
        alt="Before you leave">

    <a
        href="#page1"
        class="click page8-button"
        onclick="backToStart(); return false;"
        aria-label="Back to Start">

    </a>

</section>



<script>

/* =====================================
   MUSIC
===================================== */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


/*
   VOLUME = 20%
*/

music.volume = 0.20;



/* =====================================
   PAGE NAVIGATION
===================================== */

function goToPage(number) {

    const pages =
        document.querySelectorAll(".page");


    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    const target =
        document.getElementById(
            "page" + number
        );


    if (target) {

        target.classList.add("active");

    }


    window.scrollTo(0, 0);


    history.replaceState(
        null,
        "",
        "#page" + number
    );

}



/* =====================================
   BACK TO START
===================================== */

function backToStart() {

    /*
       Restart music from the intro
    */

    music.currentTime = 0;

    music.volume = 0.20;


    music.play()
        .catch(function() {});


    /*
       Return to Page 1
    */

    goToPage(1);

}



/* =====================================
   MUSIC ON/OFF
===================================== */

function toggleMusic() {

    if (music.paused) {

        music.volume = 0.20;

        music.play()
            .then(function() {

                musicButton.textContent = "♫";

            })
            .catch(function() {});

    }

    else {

        music.pause();

        musicButton.textContent = "♪";

    }

}



/* =====================================
   FIRST TOUCH STARTS MUSIC
===================================== */

document.addEventListener(
    "pointerdown",
    function firstTouch() {

        music.volume = 0.20;

        music.play()
            .catch(function() {});


        document.removeEventListener(
            "pointerdown",
            firstTouch
        );

    },
    {
        once: true
    }
);



/* =====================================
   DIRECT PAGE OPEN
===================================== */

window.addEventListener(
    "load",
    function() {

        const hash =
            window.location.hash;


        if (hash) {

            const number =
                parseInt(
                    hash.replace(
                        "#page",
                        ""
                    )
                );


            if (
                number >= 1 &&
                number <= 8
            ) {

                goToPage(number);

            }

        }

    }
);

</script>


</body>
   </html>
