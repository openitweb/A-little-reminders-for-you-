<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>A Little Reminder for You</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    touch-action: manipulation;
}


/* =====================================================
   PAGE
===================================================== */

.page {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    overflow: hidden;

    background: transparent;
}

.page.active {
    display: block;
}


/* =====================================================
   FULL SCREEN STAGE
===================================================== */

.stage {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;

    background: transparent;
}


/* =====================================================
   ARTWORK CANVAS

   ORIGINAL DESIGN:
   400 × 800

   IMAGE + BUTTONS ARE IN THE SAME CANVAS.
===================================================== */

.canvas {

    position: absolute;

    width: 400px;
    height: 800px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--scale));

    transform-origin: center center;

    pointer-events: none;
}


/* =====================================================
   IMAGE

   The image fills the original
   400 × 800 design.
===================================================== */

.page-image {

    position: absolute;

    left: 0;
    top: 0;

    width: 400px;
    height: 800px;

    display: block;

    object-fit: fill;

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

    -webkit-user-drag: none;
}


/* =====================================================
   TRANSPARENT CLICKABLE BUTTONS
===================================================== */

.click {

    position: absolute;

    display: block;

    background: transparent;

    border: none;

    outline: none;

    z-index: 9999;

    pointer-events: auto;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PAGE 1
   START HERE

   268 × 48
===================================================== */

.page1-button {

    width: 268px;
    height: 48px;

    left: 66px;
    top: 592px;
}


/* =====================================================
   PAGE 2
   OPEN

   210 × 42
===================================================== */

.page2-button {

    width: 210px;
    height: 42px;

    left: 95px;
    top: 628px;
}


/* =====================================================
   PAGE 3
   EMOTION BUTTONS

   EXACT RECTANGLE AREAS
===================================================== */


/* YOU'RE SAD */

.page3-sad {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 300px;
}


/* YOU'RE MAD */

.page3-mad {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 360px;
}


/* YOU MISS ME */

.page3-miss {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 420px;
}


/* YOU'RE JEALOUS */

.page3-jealous {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 480px;
}


/* =====================================================
   PAGE 4
   GO BACK
===================================================== */

.page4-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 678px;
}


/* =====================================================
   PAGE 5
   GO BACK
===================================================== */

.page5-button {

    width: 210px;
    height: 42px;

    left: 20px;
    top: 678px;
}


/* =====================================================
   PAGE 6
   GO BACK
===================================================== */

.page6-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 568px;
}


/* =====================================================
   PAGE 7
   AND THE LAST ONE
===================================================== */

.page7-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 643px;
}


/* =====================================================
   PAGE 8
   BACK TO START
===================================================== */

.page8-button {

    width: 148px;
    height: 30px;

    left: 237px;
    top: 660px;
}


/* =====================================================
   NO SCROLL
===================================================== */

body,
.page,
.stage {

    overscroll-behavior: none;
}

</style>

</head>


<body>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="music"
    src="music.mp3"
    preload="auto">
</audio>



<!-- =====================================================
     PAGE 1
===================================================== -->

<section
    class="page active"
    id="page1">

    <div class="stage">

        <div class="canvas">

            <img
                src="page1.jpg"
                class="page-image"
                alt="Page 1">

            <a
                href="#page2"
                class="click page1-button"
                onclick="startSurprise(); return false;"
                aria-label="START HERE">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 2
===================================================== -->

<section
    class="page"
    id="page2">

    <div class="stage">

        <div class="canvas">

            <img
                src="page2.jpg"
                class="page-image"
                alt="Page 2">

            <a
                href="#page3"
                class="click page2-button"
                onclick="goToPage(3); return false;"
                aria-label="OPEN">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 3
===================================================== -->

<section
    class="page"
    id="page3">

    <div class="stage">

        <div class="canvas">

            <img
                src="page3.jpg"
                class="page-image"
                alt="Choose an emotion">


            <!-- YOU'RE SAD -->

            <a
                href="#page4"
                class="click page3-sad"
                onclick="goToPage(4); return false;"
                aria-label="YOU'RE SAD">
            </a>


            <!-- YOU'RE MAD -->

            <a
                href="#page5"
                class="click page3-mad"
                onclick="goToPage(5); return false;"
                aria-label="YOU'RE MAD">
            </a>


            <!-- YOU MISS ME -->

            <a
                href="#page6"
                class="click page3-miss"
                onclick="goToPage(6); return false;"
                aria-label="YOU MISS ME">
            </a>


            <!-- YOU'RE JEALOUS -->

            <a
                href="#page7"
                class="click page3-jealous"
                onclick="goToPage(7); return false;"
                aria-label="YOU'RE JEALOUS">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 4
===================================================== -->

<section
    class="page"
    id="page4">

    <div class="stage">

        <div class="canvas">

            <img
                src="page4.jpg"
                class="page-image"
                alt="You're Sad">

            <a
                href="#page3"
                class="click page4-button"
                onclick="goToPage(3); return false;"
                aria-label="GO BACK">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 5
===================================================== -->

<section
    class="page"
    id="page5">

    <div class="stage">

        <div class="canvas">

            <img
                src="page5.jpg"
                class="page-image"
                alt="You're Mad">

            <a
                href="#page3"
                class="click page5-button"
                onclick="goToPage(3); return false;"
                aria-label="GO BACK">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 6
===================================================== -->

<section
    class="page"
    id="page6">

    <div class="stage">

        <div class="canvas">

            <img
                src="page6.jpg"
                class="page-image"
                alt="You Miss Me">

            <a
                href="#page3"
                class="click page6-button"
                onclick="goToPage(3); return false;"
                aria-label="GO BACK">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 7
===================================================== -->

<section
    class="page"
    id="page7">

    <div class="stage">

        <div class="canvas">

            <img
                src="page7.jpg"
                class="page-image"
                alt="Special Page">

            <a
                href="#page8"
                class="click page7-button"
                onclick="goToPage(8); return false;"
                aria-label="AND THE LAST ONE">
            </a>

        </div>

    </div>

</section>



<!-- =====================================================
     PAGE 8
===================================================== -->

<section
    class="page"
    id="page8">

    <div class="stage">

        <div class="canvas">

            <img
                src="page8.jpg"
                class="page-image"
                alt="Before You Leave">

            <a
                href="#page1"
                class="click page8-button"
                onclick="backToStart(); return false;"
                aria-label="BACK TO START">
            </a>

        </div>

    </div>

</section>



<script>

/* =====================================================
   FULL SCREEN + CENTERED

   BASE ARTWORK = 400 × 800

   Math.max() makes the artwork cover
   the whole phone screen.

   Because the IMAGE and BUTTONS are
   inside the same canvas, they scale
   together.
===================================================== */

function resizeCanvas() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    const scaleX =
        screenWidth / 400;

    const scaleY =
        screenHeight / 800;


    /*
       COVER

       The larger scale is used so
       no empty area is left around
       the artwork.
    */

    const scale =
        Math.max(
            scaleX,
            scaleY
        );


    document.documentElement
        .style
        .setProperty(
            "--scale",
            scale
        );
}


/* INITIAL */

resizeCanvas();


/* RESIZE */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ROTATION */

window.addEventListener(
    "orientationchange",
    resizeCanvas
);



/* =====================================================
   MUSIC
===================================================== */

const music =
    document.getElementById(
        "music"
    );


music.volume = 0.20;



/* =====================================================
   PAGE NAVIGATION
===================================================== */

function goToPage(number) {

    const pages =
        document.querySelectorAll(
            ".page"
        );


    pages.forEach(
        function(page) {

            page.classList.remove(
                "active"
            );

        }
    );


    const target =
        document.getElementById(
            "page" + number
        );


    if (target) {

        target.classList.add(
            "active"
        );

    }


    window.scrollTo(
        0,
        0
    );


    history.replaceState(
        null,
        "",
        "#page" + number
    );
}



/* =====================================================
   START HERE
===================================================== */

function startSurprise() {

    music.pause();

    music.currentTime = 0;

    music.volume = 0.20;


    const playPromise =
        music.play();


    if (
        playPromise !== undefined
    ) {

        playPromise.catch(
            function(error) {

                console.log(
                    "Music playback error:",
                    error
                );

            }
        );

    }


    goToPage(2);
}



/* =====================================================
   BACK TO START
===================================================== */

function backToStart() {

    music.pause();

    music.currentTime = 0;

    music.volume = 0.20;

    goToPage(1);
}



/* =====================================================
   PREVENT IMAGE DRAG
===================================================== */

document.addEventListener(
    "dragstart",
    function(event) {

        if (
            event.target.tagName === "IMG"
        ) {

            event.preventDefault();

        }

    }
);

</script>

</body>

      </html>
