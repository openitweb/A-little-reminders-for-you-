<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>A Little Reminder for You</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================
   BACKGROUND
========================= */

body {
    background: #ffd9e8;
}


/* =========================
   PAGE
========================= */

.page {
    position: absolute;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    background: #ffd9e8;
}

.page.active {
    display: flex;
}


/* =========================
   PAGE IMAGE
========================= */

.page-image {
    display: block;

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================
   CLICKABLE BUTTON
========================= */

.click-area {
    position: absolute;

    display: block;

    z-index: 100;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   PAGE 1
========================= */

.page1-button {

    left: 50%;
    bottom: 7%;

    width: 160px;
    height: 55px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 2
========================= */

.page2-button {

    left: 50%;
    bottom: 7%;

    width: 160px;
    height: 55px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 3
========================= */

.page3-button {

    left: 50%;
    bottom: 7%;

    width: 130px;
    height: 50px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 4
========================= */

.page4-button {

    left: 50%;
    bottom: 7%;

    width: 130px;
    height: 50px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 5
========================= */

.page5-button {

    left: 50%;
    bottom: 7%;

    width: 130px;
    height: 50px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 6
========================= */

.page6-button {

    left: 50%;
    bottom: 7%;

    width: 130px;
    height: 50px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 7
========================= */

.page7-button {

    left: 50%;
    bottom: 7%;

    width: 150px;
    height: 50px;

    transform: translateX(-50%);
}


/* =========================
   PAGE 8
   RIGHT BOTTOM
========================= */

.page8-button {

    right: 18px;
    bottom: 35px;

    width: 125px;
    height: 50px;

    z-index: 200;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-button {

    position: fixed;

    top: 12px;
    right: 12px;

    width: 42px;
    height: 42px;

    z-index: 1000;

    border: 3px solid white;

    background: #e978a7;

    color: white;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        3px 3px 0 #bd507f;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 400px) {

    .page8-button {

        right: 14px;
        bottom: 30px;

        width: 115px;
        height: 48px;
    }

    .music-button {

        width: 38px;
        height: 38px;

        top: 9px;
        right: 9px;

        font-size: 16px;
    }

}


/* =========================
   TALL PHONES
========================= */

@media (min-height: 750px) {

    .page8-button {

        bottom: 35px;
    }

}

</style>

</head>


<body>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="music"
    src="music.mp3"
    loop>
</audio>


<!-- =========================
     MUSIC CONTROL
========================= -->

<button
    type="button"
    id="musicButton"
    class="music-button"
    onclick="toggleMusic()">

    ♫

</button>



<!-- =========================
     PAGE 1
========================= -->

<section
    class="page active"
    id="page1">

    <img
        src="page1.jpg"
        class="page-image"
        alt="Page 1">

    <a
        href="#page2"
        class="click-area page1-button"
        onclick="goToPage(2); return false;"
        aria-label="Open">

    </a>

</section>



<!-- =========================
     PAGE 2
========================= -->

<section
    class="page"
    id="page2">

    <img
        src="page2.jpg"
        class="page-image"
        alt="Page 2">


    <!-- You're Sad -->

    <a
        href="#page3"
        class="click-area"
        style="
            left: 50%;
            top: 40%;
            width: 150px;
            height: 55px;
            transform: translateX(-50%);
        "
        onclick="goToPage(3); return false;"
        aria-label="You're Sad">
    </a>


    <!-- You Miss Me -->

    <a
        href="#page4"
        class="click-area"
        style="
            left: 50%;
            top: 52%;
            width: 150px;
            height: 55px;
            transform: translateX(-50%);
        "
        onclick="goToPage(4); return false;"
        aria-label="You Miss Me">
    </a>


    <!-- You're Mad -->

    <a
        href="#page5"
        class="click-area"
        style="
            left: 50%;
            top: 64%;
            width: 150px;
            height: 55px;
            transform: translateX(-50%);
        "
        onclick="goToPage(5); return false;"
        aria-label="You're Mad">
    </a>


    <!-- You Need Me -->

    <a
        href="#page6"
        class="click-area"
        style="
            left: 50%;
            top: 76%;
            width: 150px;
            height: 55px;
            transform: translateX(-50%);
        "
        onclick="goToPage(6); return false;"
        aria-label="You Need Me">
    </a>

</section>



<!-- =========================
     PAGE 3
========================= -->

<section
    class="page"
    id="page3">

    <img
        src="page3.jpg"
        class="page-image"
        alt="You're Sad">

    <a
        href="#page2"
        class="click-area page3-button"
        onclick="goToPage(2); return false;"
        aria-label="Back">

    </a>

</section>



<!-- =========================
     PAGE 4
========================= -->

<section
    class="page"
    id="page4">

    <img
        src="page4.jpg"
        class="page-image"
        alt="You Miss Me">

    <a
        href="#page2"
        class="click-area page4-button"
        onclick="goToPage(2); return false;"
        aria-label="Back">

    </a>

</section>



<!-- =========================
     PAGE 5
========================= -->

<section
    class="page"
    id="page5">

    <img
        src="page5.jpg"
        class="page-image"
        alt="You're Mad">

    <a
        href="#page2"
        class="click-area page5-button"
        onclick="goToPage(2); return false;"
        aria-label="Back">

    </a>

</section>



<!-- =========================
     PAGE 6
========================= -->

<section
    class="page"
    id="page6">

    <img
        src="page6.jpg"
        class="page-image"
        alt="You Need Me">

    <a
        href="#page7"
        class="click-area page6-button"
        onclick="goToPage(7); return false;"
        aria-label="Next">

    </a>

</section>



<!-- =========================
     PAGE 7
========================= -->

<section
    class="page"
    id="page7">

    <img
        src="page7.jpg"
        class="page-image"
        alt="Special Page">

    <a
        href="#page8"
        class="click-area page7-button"
        onclick="goToPage(8); return false;"
        aria-label="Next">

    </a>

</section>



<!-- =========================
     PAGE 8
========================= -->

<section
    class="page"
    id="page8">

    <img
        src="page8.jpg"
        class="page-image"
        alt="Before you leave">

    <!--
        Invisible button positioned
        at the RIGHT BOTTOM.
    -->

    <a
        href="#page1"
        class="click-area page8-button"
        onclick="goToPage(1); return false;"
        aria-label="Start again">

    </a>

</section>



<script>

/* =========================
   PAGE NAVIGATION
========================= */

function goToPage(number) {

    var pages =
        document.querySelectorAll(".page");


    for (
        var i = 0;
        i < pages.length;
        i++
    ) {

        pages[i]
            .classList
            .remove("active");

    }


    var selected =
        document.getElementById(
            "page" + number
        );


    if (selected) {

        selected
            .classList
            .add("active");

    }


    window.scrollTo(
        0,
        0
    );


    history.replaceState(
        null,
        "",
        "#page" + number
    );

}


/* =========================
   MUSIC
========================= */

var music =
    document.getElementById(
        "music"
    );

var musicButton =
    document.getElementById(
        "musicButton"
    );


function toggleMusic() {

    if (music.paused) {

        music.play()
            .then(function() {

                musicButton.textContent =
                    "♫";

            })
            .catch(function() {

                alert(
                    "Tap the music button again."
                );

            });

    } else {

        music.pause();

        musicButton.textContent =
            "♪";

    }

}


/* =========================
   START MUSIC AFTER FIRST TAP
========================= */

document.addEventListener(
    "click",
    function startMusic() {

        music.play()
            .catch(function() {});

        document.removeEventListener(
            "click",
            startMusic
        );

    },
    {
        once: true
    }
);


/* =========================
   OPEN DIRECT PAGE
========================= */

window.addEventListener(
    "load",
    function() {

        var hash =
            window.location.hash;


        if (hash) {

            var number =
                hash.replace(
                    "#page",
                    ""
                );


            var pageNumber =
                Number(number);


            if (
                pageNumber >= 1 &&
                pageNumber <= 8
            ) {

                goToPage(
                    pageNumber
                );

            }

        }

    }
);

</script>


</body>
      </html>
