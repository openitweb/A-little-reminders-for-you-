<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>A Little Reminder for You</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================
   BACKGROUND
========================= */

body {
    background: #ffd9e8;
}


/* =========================
   PAGE
========================= */

.page {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    justify-content: center;
    align-items: center;

    background: #ffd9e8;
}

.page.active {
    display: flex;
}


/* =========================
   IMAGE
========================= */

.page img {
    position: absolute;

    width: 100vw;
    height: 100vh;

    object-fit: contain;

    display: block;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================
   CLICK AREA
========================= */

.click {
    position: absolute;

    display: block;

    z-index: 100;

    background: transparent;

    border: none;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PAGE 1
   BUTTON = BOTTOM CENTER
===================================================== */

.p1 {
    width: 160px;
    height: 60px;

    left: 50%;
    bottom: 6%;

    transform: translateX(-50%);
}


/* =====================================================
   PAGE 2
   BUTTON = BOTTOM CENTER
===================================================== */

.p2 {
    width: 160px;
    height: 60px;

    left: 50%;
    bottom: 6%;

    transform: translateX(-50%);
}


/* =====================================================
   PAGE 3
   FOUR BUTTONS
   MIDDLE
===================================================== */

.p3-1 {
    width: 145px;
    height: 55px;

    left: 50%;
    top: 37%;

    transform: translateX(-50%);
}

.p3-2 {
    width: 145px;
    height: 55px;

    left: 50%;
    top: 48%;

    transform: translateX(-50%);
}

.p3-3 {
    width: 145px;
    height: 55px;

    left: 50%;
    top: 59%;

    transform: translateX(-50%);
}

.p3-4 {
    width: 145px;
    height: 55px;

    left: 50%;
    top: 70%;

    transform: translateX(-50%);
}


/* =====================================================
   PAGE 4
   BOTTOM LEFT
===================================================== */

.p4 {
    width: 135px;
    height: 55px;

    left: 7%;
    bottom: 6%;
}


/* =====================================================
   PAGE 5
   BOTTOM LEFT
===================================================== */

.p5 {
    width: 135px;
    height: 55px;

    left: 7%;
    bottom: 6%;
}


/* =====================================================
   PAGE 6
   BOTTOM LEFT
   HIGHER THAN PAGE 5
===================================================== */

.p6 {
    width: 135px;
    height: 55px;

    left: 7%;
    bottom: 13%;
}


/* =====================================================
   PAGE 7
   BOTTOM LEFT
===================================================== */

.p7 {
    width: 135px;
    height: 55px;

    left: 7%;
    bottom: 6%;
}


/* =====================================================
   PAGE 8
   BOTTOM RIGHT
===================================================== */

.p8 {
    width: 125px;
    height: 55px;

    right: 6%;
    bottom: 6%;
}


/* =========================
   MUSIC BUTTON
========================= */

.music {
    position: fixed;

    top: 10px;
    right: 10px;

    width: 40px;
    height: 40px;

    z-index: 1000;

    border: 2px solid white;

    background: #e978a7;

    color: white;

    font-size: 16px;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .p1,
    .p2 {
        width: 150px;
        height: 55px;
    }

    .p3-1,
    .p3-2,
    .p3-3,
    .p3-4 {
        width: 140px;
        height: 52px;
    }

    .p4,
    .p5,
    .p6,
    .p7 {
        width: 130px;
        height: 52px;
    }

    .p8 {
        width: 120px;
        height: 52px;
    }

}

</style>

</head>


<body>


<!-- =========================
     MUSIC
========================= -->

<audio
id="music"
src="music.mp3"
loop>
</audio>


<!-- =========================
     MUSIC CONTROL
========================= -->

<button
class="music"
id="musicButton"
onclick="toggleMusic()">

♫

</button>



<!-- ==================================================
     PAGE 1
================================================== -->

<section
class="page active"
id="page1">

<img
src="page1.jpg"
alt="Page 1">

<a
href="#page2"
class="click p1"
onclick="go(2); return false;"
aria-label="Open Page 2">
</a>

</section>



<!-- ==================================================
     PAGE 2
================================================== -->

<section
class="page"
id="page2">

<img
src="page2.jpg"
alt="Page 2">

<a
href="#page3"
class="click p2"
onclick="go(3); return false;"
aria-label="Open Page 3">
</a>

</section>



<!-- ==================================================
     PAGE 3
     FOUR BUTTONS
================================================== -->

<section
class="page"
id="page3">

<img
src="page3.jpg"
alt="Page 3">


<!-- BUTTON 1 -->

<a
href="#page4"
class="click p3-1"
onclick="go(4); return false;"
aria-label="Open Page 4">
</a>


<!-- BUTTON 2 -->

<a
href="#page5"
class="click p3-2"
onclick="go(5); return false;"
aria-label="Open Page 5">
</a>


<!-- BUTTON 3 -->

<a
href="#page6"
class="click p3-3"
onclick="go(6); return false;"
aria-label="Open Page 6">
</a>


<!-- BUTTON 4 -->

<a
href="#page7"
class="click p3-4"
onclick="go(7); return false;"
aria-label="Open Page 7">
</a>

</section>



<!-- ==================================================
     PAGE 4
================================================== -->

<section
class="page"
id="page4">

<img
src="page4.jpg"
alt="Page 4">

<a
href="#page3"
class="click p4"
onclick="go(3); return false;"
aria-label="Back">
</a>

</section>



<!-- ==================================================
     PAGE 5
================================================== -->

<section
class="page"
id="page5">

<img
src="page5.jpg"
alt="Page 5">

<a
href="#page3"
class="click p5"
onclick="go(3); return false;"
aria-label="Back">
</a>

</section>



<!-- ==================================================
     PAGE 6
================================================== -->

<section
class="page"
id="page6">

<img
src="page6.jpg"
alt="Page 6">

<a
href="#page3"
class="click p6"
onclick="go(3); return false;"
aria-label="Back">
</a>

</section>



<!-- ==================================================
     PAGE 7
================================================== -->

<section
class="page"
id="page7">

<img
src="page7.jpg"
alt="Page 7">

<a
href="#page8"
class="click p7"
onclick="go(8); return false;"
aria-label="Next">
</a>

</section>



<!-- ==================================================
     PAGE 8
================================================== -->

<section
class="page"
id="page8">

<img
src="page8.jpg"
alt="Before you leave">

<a
href="#page1"
class="click p8"
onclick="go(1); return false;"
aria-label="Start again">
</a>

</section>



<script>

/* =========================================
   PAGE NAVIGATION
========================================= */

function go(number) {

    const pages =
        document.querySelectorAll(".page");


    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    const target =
        document.getElementById(
            "page" + number
        );


    if (target) {

        target.classList.add("active");

    }


    window.scrollTo(0, 0);


    history.replaceState(
        null,
        "",
        "#page" + number
    );

}


/* =========================================
   MUSIC
========================================= */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


function toggleMusic() {

    if (music.paused) {

        music.play()
        .then(function() {

            musicButton.textContent = "♫";

        })
        .catch(function() {

            musicButton.textContent = "♫";

        });

    }

    else {

        music.pause();

        musicButton.textContent = "♪";

    }

}


/* =========================================
   START MUSIC AFTER FIRST TOUCH
========================================= */

document.addEventListener(
    "pointerdown",
    function startMusic() {

        if (music.paused) {

            music.play()
            .catch(function() {});

        }

        document.removeEventListener(
            "pointerdown",
            startMusic
        );

    },
    {
        once: true
    }
);


/* =========================================
   LOAD PAGE FROM URL
========================================= */

window.addEventListener(
    "load",
    function() {

        const hash =
            window.location.hash;


        if (hash) {

            const number =
                parseInt(
                    hash.replace(
                        "#page",
                        ""
                    )
                );


            if (
                number >= 1 &&
                number <= 8
            ) {

                go(number);

            }

        }

    }
);

</script>


</body>
      </html>
