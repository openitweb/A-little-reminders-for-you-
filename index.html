<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>A Little Reminder for You</title>

<style>

/* ==================================================
   RESET
================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    touch-action: manipulation;
}


/* ==================================================
   PAGE
================================================== */

.page {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    overflow: hidden;

    background: #000;
}

.page.active {
    display: block;
}


/* ==================================================
   400 × 800 DESIGN CANVAS

   IMPORTANT:
   The image AND transparent buttons
   are inside this same canvas.

   Therefore they ALWAYS scale together.
================================================== */

.canvas {

    position: absolute;

    width: 400px;
    height: 800px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--scale));

    transform-origin: center center;

    overflow: hidden;

    /*
       Prevent the canvas itself
       from receiving clicks.
    */

    pointer-events: none;
}


/* ==================================================
   IMAGE

   EXACTLY 400 × 800
================================================== */

.page-image {

    position: absolute;

    left: 0;
    top: 0;

    width: 400px;
    height: 800px;

    /*
       Image fills the entire
       design canvas.
    */

    object-fit: fill;

    display: block;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* ==================================================
   TRANSPARENT BUTTONS

   Only these areas are clickable.
================================================== */

.click {

    position: absolute;

    display: block;

    background: transparent;

    border: none;

    outline: none;

    z-index: 100;

    cursor: pointer;

    /*
       The button itself receives
       the touch/click.
    */

    pointer-events: auto;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    text-decoration: none;
}


/* ==================================================
   PAGE 1
   START HERE

   268 × 48
================================================== */

.page1-button {

    width: 268px;
    height: 48px;

    left: 66px;
    top: 592px;
}


/* ==================================================
   PAGE 2
   OPEN

   210 × 42
================================================== */

.page2-button {

    width: 210px;
    height: 42px;

    left: 95px;
    top: 628px;
}


/* ==================================================
   PAGE 3
   EMOTION BUTTONS

   248 × 44
================================================== */

.page3-sad {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 300px;
}


.page3-mad {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 360px;
}


.page3-miss {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 420px;
}


.page3-jealous {

    width: 248px;
    height: 44px;

    left: 76px;
    top: 480px;
}


/* ==================================================
   PAGE 4
   GO BACK
================================================== */

.page4-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 678px;
}


/* ==================================================
   PAGE 5
   GO BACK
================================================== */

.page5-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 678px;
}


/* ==================================================
   PAGE 6
   GO BACK

   210 × 42
   190px FROM BOTTOM

   800 - 190 - 42 = 568
================================================== */

.page6-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 568px;
}


/* ==================================================
   PAGE 7
   AND THE LAST ONE
================================================== */

.page7-button {

    width: 210px;
    height: 42px;

    left: 15px;
    top: 643px;
}


/* ==================================================
   PAGE 8
   BACK TO START
================================================== */

.page8-button {

    width: 148px;
    height: 30px;

    left: 237px;
    top: 660px;
}


/* ==================================================
   PREVENT IMAGE DRAGGING
================================================== */

img {

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

    -webkit-user-drag: none;
}


/* ==================================================
   NO SCROLL
================================================== */

body,
.page {

    overscroll-behavior: none;
}

</style>

</head>


<body>


<!-- ==================================================
     MUSIC
================================================== -->

<audio
    id="music"
    src="music.mp3"
    preload="auto">
</audio>



<!-- ==================================================
     PAGE 1
================================================== -->

<section
    class="page active"
    id="page1">

    <div class="canvas">

        <img
            src="page1.jpg"
            class="page-image"
            alt="Page 1">


        <a
            href="#page2"
            class="click page1-button"
            onclick="startSurprise(); return false;"
            aria-label="START HERE">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 2
================================================== -->

<section
    class="page"
    id="page2">

    <div class="canvas">

        <img
            src="page2.jpg"
            class="page-image"
            alt="Page 2">


        <a
            href="#page3"
            class="click page2-button"
            onclick="goToPage(3); return false;"
            aria-label="OPEN">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 3
================================================== -->

<section
    class="page"
    id="page3">

    <div class="canvas">

        <img
            src="page3.jpg"
            class="page-image"
            alt="Choose an emotion">


        <a
            href="#page4"
            class="click page3-sad"
            onclick="goToPage(4); return false;"
            aria-label="YOU'RE SAD">
        </a>


        <a
            href="#page5"
            class="click page3-mad"
            onclick="goToPage(5); return false;"
            aria-label="YOU'RE MAD">
        </a>


        <a
            href="#page6"
            class="click page3-miss"
            onclick="goToPage(6); return false;"
            aria-label="YOU MISS ME">
        </a>


        <a
            href="#page7"
            class="click page3-jealous"
            onclick="goToPage(7); return false;"
            aria-label="YOU'RE JEALOUS">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 4
================================================== -->

<section
    class="page"
    id="page4">

    <div class="canvas">

        <img
            src="page4.jpg"
            class="page-image"
            alt="You're Sad">


        <a
            href="#page3"
            class="click page4-button"
            onclick="goToPage(3); return false;"
            aria-label="GO BACK">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 5
================================================== -->

<section
    class="page"
    id="page5">

    <div class="canvas">

        <img
            src="page5.jpg"
            class="page-image"
            alt="You're Mad">


        <a
            href="#page3"
            class="click page5-button"
            onclick="goToPage(3); return false;"
            aria-label="GO BACK">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 6
================================================== -->

<section
    class="page"
    id="page6">

    <div class="canvas">

        <img
            src="page6.jpg"
            class="page-image"
            alt="You Miss Me">


        <a
            href="#page3"
            class="click page6-button"
            onclick="goToPage(3); return false;"
            aria-label="GO BACK">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 7
================================================== -->

<section
    class="page"
    id="page7">

    <div class="canvas">

        <img
            src="page7.jpg"
            class="page-image"
            alt="Special Page">


        <a
            href="#page8"
            class="click page7-button"
            onclick="goToPage(8); return false;"
            aria-label="AND THE LAST ONE">
        </a>

    </div>

</section>



<!-- ==================================================
     PAGE 8
================================================== -->

<section
    class="page"
    id="page8">

    <div class="canvas">

        <img
            src="page8.jpg"
            class="page-image"
            alt="Before You Leave">


        <a
            href="#page1"
            class="click page8-button"
            onclick="backToStart(); return false;"
            aria-label="BACK TO START">
        </a>

    </div>

</section>



<script>

/* ==================================================
   FULL SCREEN SCALING

   BASE DESIGN = 400 × 800

   IMPORTANT:
   The ENTIRE canvas is scaled.

   Image + buttons = ONE UNIT.

   Therefore buttons can never
   move away from their image.
================================================== */

function resizeCanvas() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    const scaleX =
        screenWidth / 400;

    const scaleY =
        screenHeight / 800;


    /*
       Use the larger scale so the
       artwork completely fills
       the phone screen.
    */

    const scale =
        Math.max(
            scaleX,
            scaleY
        );


    document.documentElement
        .style
        .setProperty(
            "--scale",
            scale
        );
}


/* First calculation */

resizeCanvas();


/* Recalculate whenever
   the phone changes size */

window.addEventListener(
    "resize",
    resizeCanvas
);


window.addEventListener(
    "orientationchange",
    resizeCanvas
);



/* ==================================================
   MUSIC
================================================== */

const music =
    document.getElementById(
        "music"
    );


/*
   Volume = 20%
*/

music.volume = 0.20;



/* ==================================================
   PAGE NAVIGATION
================================================== */

function goToPage(number) {

    const pages =
        document.querySelectorAll(
            ".page"
        );


    pages.forEach(
        function(page) {

            page.classList.remove(
                "active"
            );

        }
    );


    const target =
        document.getElementById(
            "page" + number
        );


    if (target) {

        target.classList.add(
            "active"
        );

    }


    window.scrollTo(
        0,
        0
    );


    history.replaceState(
        null,
        "",
        "#page" + number
    );

}



/* ==================================================
   START HERE
================================================== */

function startSurprise() {

    /*
       Start music from
       the beginning.
    */

    music.pause();

    music.currentTime = 0;

    music.volume = 0.20;


    /*
       Because this function is
       triggered by START HERE,
       mobile browsers allow
       playback.
    */

    const playPromise =
        music.play();


    if (
        playPromise !== undefined
    ) {

        playPromise.catch(
            function(error) {

                console.log(
                    "Music error:",
                    error
                );

            }
        );

    }


    /*
       Go to Page 2.
    */

    goToPage(2);

}



/* ==================================================
   BACK TO START
================================================== */

function backToStart() {

    /*
       Stop music.
    */

    music.pause();


    /*
       Reset to intro.
    */

    music.currentTime = 0;


    /*
       Keep volume at 20%.
    */

    music.volume = 0.20;


    /*
       Return to Page 1.
    */

    goToPage(1);

}



/* ==================================================
   PREVENT IMAGE DRAGGING
================================================== */

document.addEventListener(
    "dragstart",
    function(event) {

        if (
            event.target.tagName === "IMG"
        ) {

            event.preventDefault();

        }

    }
);



/* ==================================================
   HASH SUPPORT
================================================== */

window.addEventListener(
    "load",
    function() {

        const hash =
            window.location.hash;


        if (hash) {

            const number =
                parseInt(
                    hash.replace(
                        "#page",
                        ""
                    )
                );


            if (
                number >= 1 &&
                number <= 8
            ) {

                goToPage(number);

            }

        }

    }
);

</script>

</body>

   </html>
