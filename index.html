<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Little Reminder ♡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#07073e;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100vw;height:100vh;max-width:800px;overflow:hidden;background:#07073e}
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
.page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hotspot{position:absolute;display:block;z-index:5;background:transparent;border:0;cursor:pointer}
#musicBtn{
 position:fixed;right:12px;top:12px;z-index:100;width:44px;height:44px;
 border:0;border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font-size:20px;
 box-shadow:0 2px 10px rgba(0,0,0,.25)
}
#hint{
 position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
 z-index:99;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.45);
 color:#fff;font:13px Arial,sans-serif;white-space:nowrap
}
</style>
</head>
<body>
<div id="app">

  <!-- PAGE 1 -->
  <section class="page active" id="p1">
    <img src="page1.png" alt="A Little Reminder - start">
    <!-- START HERE -->
    <button class="hotspot" style="left:15%;top:73%;width:70%;height:8%" aria-label="Start here" onclick="go(2)"></button>
  </section>

  <!-- PAGE 2 -->
  <section class="page" id="p2">
    <img src="page2.png" alt="A Little Reminder - open">
    <!-- OPEN -->
    <button class="hotspot" style="left:22%;top:72%;width:58%;height:9%" aria-label="Open" onclick="go(3)"></button>
  </section>

  <!-- PAGE 3 -->
  <section class="page" id="p3">
    <img src="page3.png" alt="Open this when">
    <!-- YOU'RE SAD -->
    <button class="hotspot" style="left:17%;top:34%;width:67%;height:8%" aria-label="You're sad" onclick="go(4)"></button>
    <!-- YOU'RE MAD -->
    <button class="hotspot" style="left:17%;top:42%;width:67%;height:8%" aria-label="You're mad" onclick="go(5)"></button>
    <!-- YOU MISS ME -->
    <button class="hotspot" style="left:17%;top:50%;width:67%;height:8%" aria-label="You miss me" onclick="go(6)"></button>
    <!-- YOU'RE JEALOUS -->
    <button class="hotspot" style="left:17%;top:58%;width:67%;height:8%" aria-label="You're jealous" onclick="go(7)"></button>
  </section>

  <!-- PAGE 4 SAD -->
  <section class="page" id="p4">
    <img src="page4.png" alt="When you're sad">
    <button class="hotspot" style="left:8%;top:78%;width:55%;height:9%" aria-label="Go back" onclick="go(3)"></button>
  </section>

  <!-- PAGE 5 MAD -->
  <section class="page" id="p5">
    <img src="page5.png" alt="When you're mad">
    <button class="hotspot" style="left:7%;top:78%;width:55%;height:9%" aria-label="Go back" onclick="go(3)"></button>
  </section>

  <!-- PAGE 6 MISS -->
  <section class="page" id="p6">
    <img src="page6.png" alt="When you miss me">
    <button class="hotspot" style="left:7%;top:78%;width:55%;height:9%" aria-label="Go back" onclick="go(3)"></button>
  </section>

  <!-- PAGE 7 JEALOUS -->
  <section class="page" id="p7">
    <img src="page7.png" alt="When you're jealous">
    <!-- AND THE LAST ONE -->
    <button class="hotspot" style="left:8%;top:78%;width:57%;height:9%" aria-label="And the last one" onclick="go(8)"></button>
  </section>

  <!-- PAGE 8 -->
  <section class="page" id="p8">
    <img src="page8.png" alt="Before you go">
    <!-- BACK TO START -->
    <button class="hotspot" style="left:24%;top:86%;width:53%;height:7%" aria-label="Back to start" onclick="go(1)"></button>
  </section>

</div>

<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" type="button" aria-label="Play music" onclick="toggleMusic()">🔇</button>
<div id="hint">Tap START HERE — music begins after your first tap ♡</div>

<script>
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
const hint = document.getElementById('hint');

let musicStarted = false;

function startMusic(){
  if(musicStarted) return;
  music.volume = 0.50;
  const p = music.play();
  if(p && p.then){
    p.then(()=>{
      musicStarted = true;
      musicBtn.textContent = '🔊';
      musicBtn.setAttribute('aria-label','Pause music');
      hint.style.display='none';
    }).catch(()=>{
      // Browser blocked playback; the next tap will try again.
    });
  }
}

function toggleMusic(){
  if(music.paused){
    music.volume = 0.50;
    music.play().then(()=>{
      musicStarted=true;
      musicBtn.textContent='🔊';
      musicBtn.setAttribute('aria-label','Pause music');
      hint.style.display='none';
    }).catch(()=>{});
  }else{
    music.pause();
    musicBtn.textContent='🔇';
    musicBtn.setAttribute('aria-label','Play music');
  }
}

function go(n){
  // This click is a user gesture, so it is the best moment to start audio.
  startMusic();

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');

  window.scrollTo(0,0);
}

// If the user taps anywhere before using a button, also try to start music.
document.getElementById('app').addEventListener('click', startMusic, {passive:true});
</script>
</body>
</html>
