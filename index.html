<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Reminder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Music is hidden */
        audio {
            display: none;
        }

        /* Small invisible start area */
        #startMessage {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body>

    <!-- MUSIC -->
    <audio id="music" autoplay loop playsinline>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>


    <!-- PAGE 1 -->
    <section class="page">
        <img src="page1.png" alt="Page 1">
    </section>

    <!-- PAGE 2 -->
    <section class="page">
        <img src="page2.png" alt="Page 2">
    </section>

    <!-- PAGE 3 -->
    <section class="page">
        <img src="page3.png" alt="Page 3">
    </section>

    <!-- PAGE 4 -->
    <section class="page">
        <img src="page4.png" alt="Page 4">
    </section>

    <!-- PAGE 5 -->
    <section class="page">
        <img src="page5.png" alt="Page 5">
    </section>

    <!-- PAGE 6 -->
    <section class="page">
        <img src="page6.png" alt="Page 6">
    </section>

    <!-- PAGE 7 -->
    <section class="page">
        <img src="page7.png" alt="Page 7">
    </section>

    <!-- PAGE 8 -->
    <section class="page">
        <img src="page8.png" alt="Page 8">
    </section>


    <script>

        const music = document.getElementById("music");

        // Try to start music automatically
        window.addEventListener("load", function () {
            music.volume = 1.0;

            const playPromise = music.play();

            if (playPromise !== undefined) {
                playPromise.catch(function () {
                    // Browser blocked autoplay.
                    // Music will start on the first touch/click.
                });
            }
        });


        // Start music when the visitor touches the screen
        function startMusic() {
            music.volume = 1.0;
            music.play().catch(function () {});
        }

        document.addEventListener("click", startMusic, {
            once: true
        });

        document.addEventListener("touchstart", startMusic, {
            once: true
        });

    </script>

</body>
          </html>
