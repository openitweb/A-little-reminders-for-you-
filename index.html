<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Hi Baby 💗</title>

<style>

/* =========================
   BASIC
   ========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080b48;
}

body {
    touch-action: manipulation;
}


/* =========================
   APP
   ========================= */

#app {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;
}


/* =========================
   PAGES
   ========================= */

.page {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    overflow: hidden;
}

.page.active {
    display: block;
}


/* =========================
   IMAGES
   ========================= */

.page img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center;
}


/* =========================
   INVISIBLE CLICKABLE AREAS
   ========================= */

.button {
    position: absolute;

    z-index: 100;

    display: block;

    border: none;
    outline: none;

    padding: 0;
    margin: 0;

    background: transparent;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-appearance: none;
    appearance: none;
}


/* =========================
   PAGE 1
   START HERE
   ========================= */

.start-button {
    left: 10%;
    top: 72%;

    width: 80%;
    height: 14%;
}


/* =========================
   PAGE 2
   OPEN
   ========================= */

.open-button {
    left: 10%;
    top: 70%;

    width: 80%;
    height: 14%;
}


/* =========================
   PAGE 3
   MENU
   ========================= */


/* SAD */

.sad-button {
    left: 10%;
    top: 31%;

    width: 80%;
    height: 9%;
}


/* YOU'RE MAD */

.mad-button {
    left: 10%;
    top: 40%;

    width: 80%;
    height: 9%;
}


/* YOU MISS ME */

.miss-button {
    left: 10%;
    top: 49%;

    width: 80%;
    height: 9%;
}


/* YOU'RE JEALOUS */

.jealous-button {
    left: 10%;
    top: 58%;

    width: 80%;
    height: 9%;
}


/* =========================
   PAGE 4
   GO BACK
   ========================= */

.page4 .back-button {
    left: 5%;
    bottom: 6%;

    width: 65%;
    height: 12%;
}


/* =========================
   PAGE 5
   GO BACK
   ========================= */

.page5 .back-button {
    left: 5%;
    bottom: 9%;

    width: 65%;
    height: 12%;
}


/* =========================
   PAGE 6
   GO BACK
   RAISED ANOTHER 3%
   ========================= */

.page6 .back-button {
    left: 5%;
    bottom: 17%;
    width: 65%;
    height: 12%;
}


/* =========================
   PAGE 7
   AND THE LAST ONE
   ========================= */

.last-button {
    left: 5%;
    bottom: 6%;

    width: 65%;
    height: 12%;
}


/* =========================
   PAGE 8
   GO BACK TO START
   ========================= */

.home-button {
    left: 20%;
    bottom: 4%;

    width: 60%;
    height: 12%;
}


/* =========================
   LANDSCAPE
   ========================= */

@media (min-aspect-ratio: 1/1) {

    .page img {
        object-fit: contain;
    }

}

</style>

</head>


<body>


<!-- =========================
     MUSIC
     ========================= -->

<audio
    id="music"
    src="./music.mp3"
    preload="auto">
</audio>


<div id="app">


<!-- =========================
     PAGE 1
     ========================= -->

<section class="page page1 active">

    <img
        src="./page1.jpg"
        alt="Page 1">

    <button
        type="button"
        class="button start-button"
        aria-label="Start Here"
        onclick="startExperience('page2')">
    </button>

</section>


<!-- =========================
     PAGE 2
     ========================= -->

<section class="page page2">

    <img
        src="./page2.jpg"
        alt="Page 2">

    <button
        type="button"
        class="button open-button"
        aria-label="Open"
        onclick="showPage('page3')">
    </button>

</section>


<!-- =========================
     PAGE 3
     MENU
     ========================= -->

<section class="page page3">

    <img
        src="./menu.jpg"
        alt="Page 3">

    <button
        type="button"
        class="button sad-button"
        aria-label="Sad"
        onclick="showPage('page4')">
    </button>

    <button
        type="button"
        class="button mad-button"
        aria-label="You're Mad"
        onclick="showPage('page5')">
    </button>

    <button
        type="button"
        class="button miss-button"
        aria-label="You Miss Me"
        onclick="showPage('page6')">
    </button>

    <button
        type="button"
        class="button jealous-button"
        aria-label="You're Jealous"
        onclick="showPage('page7')">
    </button>

</section>


<!-- =========================
     PAGE 4
     SAD
     ========================= -->

<section class="page page4">

    <img
        src="./sad.jpg"
        alt="Page 4">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('page3')">
    </button>

</section>


<!-- =========================
     PAGE 5
     MAD
     ========================= -->

<section class="page page5">

    <img
        src="./mad.jpg"
        alt="Page 5">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('page3')">
    </button>

</section>


<!-- =========================
     PAGE 6
     MISS YOU
     ========================= -->

<section class="page page6">

    <img
        src="./miss-you.jpg"
        alt="Page 6">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('page3')">
    </button>

</section>


<!-- =========================
     PAGE 7
     JEALOUS
     ========================= -->

<section class="page page7">

    <img
        src="./jealous.jpg"
        alt="Page 7">

    <button
        type="button"
        class="button last-button"
        aria-label="And The Last One"
        onclick="showPage('page8')">
    </button>

</section>


<!-- =========================
     PAGE 8
     FINAL
     ========================= -->

<section class="page page8">

    <img
        src="./final.jpg"
        alt="Page 8">

    <button
        type="button"
        class="button home-button"
        aria-label="Go Back To Start"
        onclick="goBackToStart()">
    </button>

</section>


</div>


<script>

/* =========================
   PAGES
   ========================= */

const pages =
    document.querySelectorAll(".page");


/* =========================
   MUSIC
   ========================= */

const music =
    document.getElementById("music");


/* 25% VOLUME */

music.volume = 0.25;


/* IMPORTANT:
   No loop.
   Music will play only once.
*/

music.loop = false;


/* =========================
   MUSIC STATE
   ========================= */

let musicStarted = false;


/* =========================
   START EXPERIENCE
   ========================= */

function startExperience(pageName) {

    /*
       Music starts only once,
       when START HERE is pressed.
    */

    if (!musicStarted) {

        musicStarted = true;

        music.volume = 0.25;

        music.currentTime = 0;

        music.play().catch(function() {

            musicStarted = false;

        });

    }


    showPage(pageName);

}


/* =========================
   CHANGE PAGE
   ========================= */

function showPage(pageName) {

    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    const target =
        document.querySelector("." + pageName);


    if (target) {

        target.classList.add("active");

    }

}


/* =========================
   PAGE 8
   GO BACK TO START
   ========================= */

function goBackToStart() {

    /*
       Return to Page 1,
       but DO NOT restart music.
    */

    showPage("page1");

}


/* =========================
   PREVENT MUSIC FROM
   STARTING AGAIN
   ========================= */

music.addEventListener("ended", function() {

    /*
       Music has finished.
       It will NOT repeat.
    */

    music.pause();

});

</script>


</body>

          </html>
