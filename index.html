<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hi Baby 💗</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b48;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
}

.page.active {
    display: block;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* INVISIBLE CLICK AREA */

.button {
    position: absolute;
    z-index: 20;

    border: none;
    outline: none;
    padding: 0;
    margin: 0;

    background: transparent;

    cursor: pointer;
    touch-action: manipulation;

    -webkit-appearance: none;
    appearance: none;
}


/* =========================
   PAGE 1
   ========================= */

/*
   Invisible area over the
   START HERE button in image
*/

.start-button {
    left: 10%;
    bottom: 7%;
    width: 80%;
    height: 13%;
}


/* =========================
   PAGE 2
   ========================= */

.open-button {
    left: 10%;
    bottom: 7%;
    width: 80%;
    height: 13%;
}


/* =========================
   MENU
   ========================= */

.menu-button {
    left: 10%;
    width: 80%;
    height: 9%;

    background: transparent;
}


/* SAD */

.sad-button {
    top: 31%;
}


/* MAD */

.mad-button {
    top: 40%;
}


/* MISS YOU */

.miss-button {
    top: 49%;
}


/* JEALOUS */

.jealous-button {
    top: 58%;
}


/* =========================
   BACK BUTTON
   ========================= */

.back-button {
    left: 5%;
    bottom: 6%;
    width: 65%;
    height: 12%;
}


/* =========================
   FINAL
   ========================= */

.home-button {
    left: 20%;
    bottom: 4%;
    width: 60%;
    height: 11%;
}

</style>
</head>

<body>

<!-- MUSIC -->

<audio
    id="music"
    src="./music.mp3"
    loop
    preload="auto">
</audio>


<div id="app">


<!-- =========================
     PAGE 1
     ========================= -->

<section class="page page1 active">

    <img
        src="./page1.jpg"
        alt="Hi Baby">

    <!-- INVISIBLE BUTTON -->

    <button
        type="button"
        class="button start-button"
        aria-label="Start Here"
        onclick="showPage('page2')">
    </button>

</section>


<!-- =========================
     PAGE 2
     ========================= -->

<section class="page page2">

    <img
        src="./page2.jpg"
        alt="Page 2">

    <!-- INVISIBLE BUTTON -->

    <button
        type="button"
        class="button open-button"
        aria-label="Open"
        onclick="showPage('menu')">
    </button>

</section>


<!-- =========================
     MENU
     ========================= -->

<section class="page menu">

    <img
        src="./menu.jpg"
        alt="Menu">


    <!-- SAD -->

    <button
        type="button"
        class="button menu-button sad-button"
        aria-label="Sad"
        onclick="showPage('sad')">
    </button>


    <!-- MAD -->

    <button
        type="button"
        class="button menu-button mad-button"
        aria-label="Mad"
        onclick="showPage('mad')">
    </button>


    <!-- MISS YOU -->

    <button
        type="button"
        class="button menu-button miss-button"
        aria-label="Miss You"
        onclick="showPage('miss')">
    </button>


    <!-- JEALOUS -->

    <button
        type="button"
        class="button menu-button jealous-button"
        aria-label="Jealous"
        onclick="showPage('jealous')">
    </button>

</section>


<!-- =========================
     SAD
     ========================= -->

<section class="page sad">

    <img
        src="./sad.jpg"
        alt="Sad">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('menu')">
    </button>

</section>


<!-- =========================
     MAD
     ========================= -->

<section class="page mad">

    <img
        src="./mad.jpg"
        alt="Mad">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('menu')">
    </button>

</section>


<!-- =========================
     MISS YOU
     ========================= -->

<section class="page miss">

    <img
        src="./miss-you.jpg"
        alt="Miss You">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('menu')">
    </button>

</section>


<!-- =========================
     JEALOUS
     ========================= -->

<section class="page jealous">

    <img
        src="./jealous.jpg"
        alt="Jealous">

    <button
        type="button"
        class="button back-button"
        aria-label="Go Back"
        onclick="showPage('menu')">
    </button>

</section>


<!-- =========================
     FINAL
     ========================= -->

<section class="page final">

    <img
        src="./final.jpg"
        alt="Final">

    <button
        type="button"
        class="button home-button"
        aria-label="Back to Start"
        onclick="showPage('page1')">
    </button>

</section>


</div>


<script>

const pages = document.querySelectorAll(".page");
const music = document.getElementById("music");


/* =========================
   MUSIC
   ========================= */

function startMusic() {

    music.play().catch(function() {

    });

}


/* =========================
   CHANGE PAGE
   ========================= */

function showPage(pageName) {

    startMusic();

    pages.forEach(function(page) {
        page.classList.remove("active");
    });

    const target =
        document.querySelector("." + pageName);

    if (target) {
        target.classList.add("active");
    }

}


/* =========================
   START MUSIC WHEN TAPPED
   ========================= */

document.addEventListener(
    "pointerdown",
    startMusic,
    { once: true }
);

</script>

</body>
</html>
