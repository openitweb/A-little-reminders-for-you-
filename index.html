<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b48">
<title>Hi Baby 💗</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#070a46;overflow:hidden}
#app{width:100vw;height:100dvh;position:relative;display:flex;align-items:center;justify-content:center}
.page{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.page.active{display:flex}
.page img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.hit{
  position:absolute;
  border:0;background:transparent;padding:0;margin:0;
  cursor:pointer;z-index:10;
  border-radius:18px;
}
.hit:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:3px}
#loading{
  position:fixed;inset:0;z-index:100;background:#070a46;
  display:flex;align-items:center;justify-content:center;
  color:white;font-family:Arial,sans-serif;font-size:14px;
  letter-spacing:2px;transition:opacity .25s;
}
#loading.hide{opacity:0;pointer-events:none}

/* Coordinates are percentages of the 750×1500 artwork.
   They remain clickable on phones of different sizes. */
.page1 .start{left:15.5%;top:74.8%;width:69%;height:7.2%}
.page2 .open{left:21%;top:73.5%;width:57%;height:7.0%}

.menu .sad{left:17%;top:33.5%;width:66%;height:7.0%}
.menu .mad{left:17%;top:41.2%;width:66%;height:7.0%}
.menu .miss{left:17%;top:49.0%;width:66%;height:7.0%}
.menu .jealous{left:17%;top:56.8%;width:66%;height:7.0%}

.content .back{left:7%;top:79.0%;width:55%;height:6.5%}
.final .home{left:27%;top:91.0%;width:48%;height:6.0%}

@media (min-aspect-ratio: 1/1){
  .page img{object-fit:contain}
}
</style>
</head>
<body>
<div id="loading">LOADING YOUR LITTLE SURPRISE… 💗</div>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<main id="app">
  <section class="page page1 active">
    <img src="images/page1.jpg" alt="Hi Baby — welcome page">
    <button class="hit start" aria-label="Start here" onclick="showPage('page2')"></button>
  </section>

  <section class="page page2">
    <img src="images/page2.jpg" alt="A little message">
    <button class="hit open" aria-label="Open" onclick="showPage('menu')"></button>
  </section>

  <section class="page menu">
    <img src="images/menu.jpg" alt="Open this when menu">
    <button class="hit sad" aria-label="Open when you're sad" onclick="showPage('sad')"></button>
    <button class="hit mad" aria-label="Open when you're mad" onclick="showPage('mad')"></button>
    <button class="hit miss" aria-label="Open when you miss me" onclick="showPage('miss')"></button>
    <button class="hit jealous" aria-label="Open when you're jealous" onclick="showPage('jealous')"></button>
  </section>

  <section class="page content sad">
    <img src="images/sad.jpg" alt="A message for when you're sad">
    <button class="hit back" aria-label="Go back" onclick="showPage('menu')"></button>
  </section>

  <section class="page content mad">
    <img src="images/mad.jpg" alt="A message for when you're mad">
    <button class="hit back" aria-label="Go back" onclick="showPage('menu')"></button>
  </section>

  <section class="page content miss">
    <img src="images/miss-you.jpg" alt="A message for when you miss me">
    <button class="hit back" aria-label="Go back" onclick="showPage('menu')"></button>
  </section>

  <section class="page content jealous">
    <img src="images/jealous.jpg" alt="A message for when you're jealous">
    <button class="hit back" aria-label="Go back" onclick="showPage('menu')"></button>
  </section>

  <section class="page final">
    <img src="images/final.jpg" alt="Before you go">
    <button class="hit home" aria-label="Back to start" onclick="showPage('page1')"></button>
  </section>
</main>

<script>
const pages = [...document.querySelectorAll('.page')];

function startMusic(){
  const music = document.getElementById('bgMusic');
  if(music.paused){
    music.play().catch(() => {});
  }
}

function showPage(name){
  startMusic();
  pages.forEach(p => p.classList.remove('active'));
  const target = document.querySelector('.' + name);
  if(target) target.classList.add('active');
  window.scrollTo(0,0);
}

document.addEventListener('pointerdown', startMusic, {once:true});

window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 250);
});
</script>
</body>
</html>
